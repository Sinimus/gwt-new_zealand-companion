name: Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm build

      - name: Run tests
        run: pnpm test

  # Builds the production image without pushing it and tests it in a browser,
  # on pull requests and before every publish, so a broken Dockerfile, nginx.conf
  # or bundle fails here instead of in the deploy
  docker-build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gwt-nz-companion:ci

      - name: Smoke test the image
        run: |
          docker run --detach --name smoke --publish 8080:80 gwt-nz-companion:ci
          for i in $(seq 1 30); do
            if curl --silent --fail --output page.html http://localhost:8080/; then
              echo "Container answered on attempt ${i}"
              break
            fi
            sleep 2
          done
          set -e
          curl --silent --fail --output page.html http://localhost:8080/
          grep --quiet '<title>GWT New Zealand Companion</title>' page.html
          curl --silent --fail --head http://localhost:8080/ | grep --quiet --ignore-case '^cache-control: no-cache'
          curl --silent --fail --head http://localhost:8080/manifest.webmanifest | grep --quiet --ignore-case '^content-type: application/manifest+json'
          curl --silent --fail --head http://localhost:8080/sw.js | grep --quiet --ignore-case '^cache-control: no-cache'
          curl --silent --fail --head http://localhost:8080/ | grep --quiet --ignore-case '^x-content-type-options: nosniff'
          asset=$(grep --only-matching '/assets/index-[A-Za-z0-9_-]*\.js' page.html | head -n 1)
          curl --silent --fail --head "http://localhost:8080${asset}" | grep --quiet --ignore-case '^cache-control: public, immutable'
          docker exec smoke wget -q --spider http://127.0.0.1/
          echo "Smoke test passed"

      # Browser test against the same running container: every page in
      # e2e/routes.json must render from the bundle without a JavaScript error
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser test the image
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs smoke || true
          docker rm --force smoke || true

  publish:
    needs: [test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          RESPONSE=$(curl --silent --show-error --request POST \
            "https://coolify.sinimus.com/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            --write-out "\nHTTP_STATUS:%{http_code}")
          echo "$RESPONSE"
          HTTP_CODE=$(echo "$RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deploy trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi
